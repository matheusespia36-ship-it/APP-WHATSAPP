name: Build Android (App Novo Compose + Node.js Embedded)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar Codigo
        uses: actions/checkout@v4

      - name: Configurar Node.js 22 (Ambiente de Build)
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Configurar Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Conferir arquivos do backend na raiz
        run: |
          ls -la
          for f in server.js bootstrap.js package.json; do
            [ -f "$f" ] || { echo "Erro fatal: falta $f na raiz do repositorio."; exit 1; }
          done

      - name: Baixar libnode.so e headers (nodejs-mobile) para ARM64
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download --repo digidem/nodejs-mobile --pattern 'nodejs-mobile-android-[0-9]*.zip' --output nm.zip
          unzip -q nm.zip -d nm
          mkdir -p lib_node_temp lib_node_headers
          LIB=$(find nm -path "*arm64-v8a*" -name libnode.so | head -n 1)
          HDR=$(find nm -name node.h | head -n 1)
          [ -n "$LIB" ] || { echo "Erro fatal: libnode.so arm64-v8a nao encontrado no zip."; exit 1; }
          [ -n "$HDR" ] || { echo "Erro fatal: node.h nao encontrado no zip."; exit 1; }
          cp "$LIB" lib_node_temp/libnode.so
          cp -r "$(dirname "$HDR")"/. lib_node_headers/
          ls -lh lib_node_temp/libnode.so

      - name: Ligar libnode.so ao projeto (JNI + CMake no App Novo)
        shell: python
        run: |
          import os, shutil
          main = 'app/src/main'
          os.makedirs(main + '/jniLibs/arm64-v8a', exist_ok=True)
          os.makedirs(main + '/cpp/include/node', exist_ok=True)
          shutil.copy('lib_node_temp/libnode.so', main + '/jniLibs/arm64-v8a/libnode.so')
          shutil.copytree('lib_node_headers', main + '/cpp/include/node', dirs_exist_ok=True)
          print('OK: libnode.so e headers copiados para app/src/main')

      - name: Copiar backend e instalar dependencias no assets
        run: |
          set -x
          NP=app/src/main/assets/nodejs-project
          mkdir -p $NP
          cp server.js bootstrap.js package.json $NP/
          (cd $NP && npm install --omit=dev --no-audit --no-fund --ignore-scripts) || { echo "ERRO: npm install do backend falhou"; exit 1; }
          ls -la $NP

      - name: Executar gradlew assembleDebug
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Conferir libnode no APK
        run: unzip -l app/build/outputs/apk/debug/app-debug.apk | grep -E "libnode|libnative-lib|nodejs-project/server.js|nodejs-project/bootstrap.js"

      - name: Disponibilizar APK para Download
        uses: actions/upload-artifact@v4
        with:
          name: Disparador-WhatsApp-Compose
          path: app/build/outputs/apk/debug/app-debug.apk
          
