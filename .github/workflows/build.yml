name: Compilar APK Disparador WhatsApp

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build APK Android
    runs-on: ubuntu-latest
    steps:
      - name: Baixar Codigo do Repositorio
        uses: actions/checkout@v4

      - name: Configurar Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Configurar Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Preparar e Sincronizar Arquivos do Backend (Assets)
        run: |
          echo "=== Sincronizando arquivos do backend para os assets do app ==="
          mkdir -p app/src/main/assets/nodejs-project/public

          # Sincroniza arquivos de backend da raiz ou subdiretorios para os assets
          for f in server.js bootstrap.js package.json capacitor.config.json; do
            if [ -f "$f" ]; then
              cp "$f" app/src/main/assets/nodejs-project/
              echo "Copiado $f da raiz para assets"
            else
              FOUND=$(find . -maxdepth 4 -name "$f" 2>/dev/null | grep -v "assets/nodejs-project" | head -n 1)
              if [ -n "$FOUND" ] && [ -f "$FOUND" ]; then
                cp "$FOUND" app/src/main/assets/nodejs-project/
                echo "Copiado $FOUND para assets"
              fi
            fi
          done

          # Sincroniza index.html para public
          if [ -f "public/index.html" ]; then
            cp public/index.html app/src/main/assets/nodejs-project/public/index.html
          elif [ -f "www/index.html" ]; then
            cp www/index.html app/src/main/assets/nodejs-project/public/index.html
          else
            FOUND_HTML=$(find . -maxdepth 4 -name "index.html" 2>/dev/null | grep -v "assets/nodejs-project" | head -n 1)
            if [ -n "$FOUND_HTML" ] && [ -f "$FOUND_HTML" ]; then
              cp "$FOUND_HTML" app/src/main/assets/nodejs-project/public/index.html
            fi
          fi

          # Instalar dependencias de producao se package.json estiver presente
          if [ -f "app/src/main/assets/nodejs-project/package.json" ]; then
            echo "Instalando dependencias de producao do backend..."
            (cd app/src/main/assets/nodejs-project && npm install --omit=dev --no-audit --no-fund --ignore-scripts || true)
          fi

          echo "Conteudo da pasta assets:"
          ls -la app/src/main/assets/nodejs-project/

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Garantir Permissao do Gradlew
        run: |
          if [ ! -f "gradlew" ]; then
            echo "Gerando gradle wrapper..."
            gradle wrapper || true
          fi
          chmod +x gradlew

      - name: Compilar APK (assembleDebug)
        run: |
          ./gradlew :app:assembleDebug --stacktrace

      - name: Verificar APK Gerado
        run: |
          echo "=== Verificando APK gerado ==="
          ls -lh app/build/outputs/apk/debug/app-debug.apk
          unzip -l app/build/outputs/apk/debug/app-debug.apk | grep -E "AndroidManifest|classes.dex|assets/nodejs-project" | head -30

      - name: Disponibilizar APK para Download
        uses: actions/upload-artifact@v4
        with:
          name: Disparador-WhatsApp-Debug
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
