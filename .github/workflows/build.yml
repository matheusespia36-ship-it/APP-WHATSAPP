name: Compilar APK Autonomo Local (Node.js Embutido)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar Codigo
        uses: actions/checkout@v4

      - name: Configurar Node.js 22 (Ambiente de Build)
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Configurar Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Conferir arquivos do backend
        run: |
          ls -la
          for f in server.js bootstrap.js package.json public/index.html capacitor.config.json; do
            [ -f "$f" ] || { echo "Erro fatal: falta $f na raiz do repositorio."; exit 1; }
          done
          grep -q startNodeWithArguments android/app/src/main/java/com/disparador/app/MainActivity.java \
            || { echo "Erro fatal: MainActivity.java customizado nao encontrado em android/app/src/main/java/com/disparador/app/"; exit 1; }

      - name: Baixar libnode.so e headers (nodejs-mobile) para ARM64
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download --repo digidem/nodejs-mobile --pattern 'nodejs-mobile-android-[0-9]*.zip' --output nm.zip
          unzip -q nm.zip -d nm
          find nm -maxdepth 4 | head -40
          mkdir -p lib_node_temp lib_node_headers
          LIB=$(find nm -path "*arm64-v8a*" -name libnode.so | head -n 1)
          HDR=$(find nm -name node.h | head -n 1)
          [ -n "$LIB" ] || { echo "Erro fatal: libnode.so arm64-v8a nao encontrado no zip."; exit 1; }
          [ -n "$HDR" ] || { echo "Erro fatal: node.h nao encontrado no zip."; exit 1; }
          cp "$LIB" lib_node_temp/libnode.so
          cp -r "$(dirname "$HDR")"/. lib_node_headers/
          ls -lh lib_node_temp/libnode.so

      - name: Preparar Projeto Android
        run: |
          npm install --no-audit --no-fund
          npm install @capacitor/core@6.0.0 @capacitor/android@6.0.0 @capacitor/cli@6.0.0 --no-save --no-audit --no-fund
          mkdir -p www
          cp public/index.html www/index.html

          # Guarda o Java customizado, recria o projeto e devolve o Java
          rm -rf /tmp/custom_java /tmp/custom_cpp
          cp -r android/app/src/main/java /tmp/custom_java
          [ -d android/app/src/main/cpp ] && cp -r android/app/src/main/cpp /tmp/custom_cpp || true
          rm -rf android
          npx cap add android
          rm -rf android/app/src/main/java
          cp -r /tmp/custom_java android/app/src/main/java
          [ -d /tmp/custom_cpp ] && cp -r /tmp/custom_cpp android/app/src/main/cpp || true
          npx cap sync android

      - name: Ligar libnode.so ao projeto (JNI + CMake)
        run: |
          MAIN=android/app/src/main
          mkdir -p $MAIN/jniLibs/arm64-v8a $MAIN/cpp/include/node
          cp lib_node_temp/libnode.so $MAIN/jniLibs/arm64-v8a/libnode.so
          cp -r lib_node_headers/. $MAIN/cpp/include/node/

          if [ ! -f $MAIN/cpp/native-lib.cpp ]; then
          cat > $MAIN/cpp/native-lib.cpp << 'EOF'
          #include <jni.h>
          #include <string.h>
          #include <stdlib.h>
          #include "node.h"

          extern "C" JNIEXPORT jint JNICALL
          Java_com_disparador_app_MainActivity_startNodeWithArguments(JNIEnv* env, jobject, jobjectArray arguments) {
            jsize argc = env->GetArrayLength(arguments);
            size_t total = 0;
            for (int i = 0; i < argc; i++) {
              jstring s = (jstring)env->GetObjectArrayElement(arguments, i);
              const char* c = env->GetStringUTFChars(s, 0);
              total += strlen(c) + 1;
              env->ReleaseStringUTFChars(s, c);
            }
            char* buf = (char*)calloc(total, sizeof(char));
            char** argv = (char**)calloc(argc, sizeof(char*));
            char* cur = buf;
            for (int i = 0; i < argc; i++) {
              jstring s = (jstring)env->GetObjectArrayElement(arguments, i);
              const char* c = env->GetStringUTFChars(s, 0);
              strncpy(cur, c, strlen(c));
              argv[i] = cur;
              cur += strlen(c) + 1;
              env->ReleaseStringUTFChars(s, c);
            }
            return jint(node::Start(argc, argv));
          }
          EOF
          fi

          if [ ! -f $MAIN/cpp/CMakeLists.txt ]; then
          cat > $MAIN/cpp/CMakeLists.txt << 'EOF'
          cmake_minimum_required(VERSION 3.18.1)
          project("native-lib")
          include_directories(${CMAKE_CURRENT_SOURCE_DIR}/include/node)
          add_library(node SHARED IMPORTED)
          set_target_properties(node PROPERTIES IMPORTED_LOCATION ${CMAKE_CURRENT_SOURCE_DIR}/../jniLibs/${ANDROID_ABI}/libnode.so)
          add_library(native-lib SHARED native-lib.cpp)
          target_link_libraries(native-lib node log)
          EOF
          fi

          # Liga o CMake no build.gradle e fixa arm64 e minSdk 24
          python3 - << 'EOF'
          p = 'android/app/build.gradle'
          s = open(p).read()
          if 'externalNativeBuild' not in s:
              s = s.replace('android {', 'android {\n    externalNativeBuild {\n        cmake {\n            path "src/main/cpp/CMakeLists.txt"\n        }\n    }', 1)
              s = s.replace('defaultConfig {', 'defaultConfig {\n        ndk { abiFilters "arm64-v8a" }\n        externalNativeBuild { cmake { arguments "-DANDROID_STL=c++_shared" } }', 1)
              open(p, 'w').write(s)
          EOF
          sed -i -E 's/minSdkVersion = [0-9]+/minSdkVersion = 24/' android/variables.gradle

      - name: Copiar backend e dependencias
        run: |
          NP=android/app/src/main/assets/nodejs-project
          mkdir -p $NP/public
          cp server.js bootstrap.js package.json $NP/
          cp public/index.html $NP/public/
          (cd $NP && npm install --omit=dev --no-audit --no-fund --ignore-scripts)
          M=android/app/src/main/AndroidManifest.xml
          grep -q usesCleartextTraffic $M || sed -i 's/<application/<application android:usesCleartextTraffic="true"/' $M
          grep -q ex
